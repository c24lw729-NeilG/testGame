<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>乘法公式翻牌挑戰 - 主選單</title>
    <style>
        body {
            font-family: 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(135deg, #f4f7f6, #e0eafc);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .title-container {
            text-align: center;
            margin-bottom: 50px;
        }

        .title-container h1 {
            font-size: 48px;
            color: #2c3e50;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .title-container p {
            font-size: 20px;
            color: #7f8c8d;
        }

        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 25px;
            width: 100%;
            max-width: 400px;
        }

        .menu-btn {
            font-size: 24px;
            padding: 20px;
            border: none;
            border-radius: 15px;
            background-color: #ffffff;
            color: #333;
            cursor: pointer;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
        }

        .menu-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 20px rgba(0,0,0,0.15);
        }

        /* 針對不同難度設定左側顏色標籤 */
        .btn-basic { border-left: 8px solid #2ed573; }
        .btn-advanced { border-left: 8px solid #ff4757; }
        .btn-custom { border-left: 8px solid #3742fa; }

        .btn-desc {
            font-size: 14px;
            color: #95a5a6;
            font-weight: normal;
        }

        .footer {
            position: absolute;
            bottom: 20px;
            font-size: 14px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>

    <div class="title-container">
        <h1>乘法公式翻牌挑戰</h1>
        <p>請選擇你要挑戰的難度</p>
    </div>

    <div class="menu-container">
        <a href="basic.html" class="menu-btn btn-basic">
            <div>基礎版<br><span class="btn-desc">單題 5 秒 / 僅含 x 的係數為 1 的題型</span></div>
            <span>▶</span>
        </a>

        <a href="advanced.html" class="menu-btn btn-advanced">
            <div>進階版<br><span class="btn-desc">單題 3 秒 / 包含各類係數變化 / 總時 2 分鐘</span></div>
            <span>▶</span>
        </a>

        <a href="custom.html" class="menu-btn btn-custom">
            <div>自由設定<br><span class="btn-desc">自訂挑戰時間與難度參數</span></div>
            <span>⚙️</span>
        </a>
    </div>

    <div class="footer">本遊戲由阿緯老師設計</div>

</body>
</html>
