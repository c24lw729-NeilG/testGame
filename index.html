<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>乘法公式翻牌挑戰 (2分鐘極速版)</title>
    <style>
        body {
            font-family: 'Microsoft JhengHei', sans-serif;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
        }

        .info-board {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            background: #fff;
            padding: 10px 30px;
            border-radius: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .time-alert {
            color: #e74c3c;
        }

        /* 卡牌區塊 */
        .card-container {
            width: 320px;
            height: 220px;
            perspective: 1000px;
            margin-bottom: 30px;
            cursor: pointer;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            border-radius: 15px;
        }

        .card.flipped {
            transform: rotateY(180deg);
            cursor: default;
        }

        .card-face {
            width: 100%;
            height: 100%;
            position: absolute;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            border-radius: 15px;
            font-weight: bold;
        }

        .card-back {
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            color: white;
            font-size: 24px;
        }

        .card-back::after {
            content: '點擊翻牌';
            font-size: 22px;
            letter-spacing: 2px;
        }

        .card-front {
            background: #ffffff;
            color: #2c3e50;
            transform: rotateY(180deg);
            border: 3px solid #a777e3;
        }

        /* 單題計時器 */
        .timer-container {
            width: 320px;
            height: 15px;
            background: #e0e0e0;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
            visibility: hidden;
        }

        .timer-bar {
            height: 100%;
            width: 100%;
            background: #ff4757;
            transition: width 0.1s linear;
        }

        /* 選項按鈕區 */
        .options-container {
            display: flex;
            gap: 15px;
            visibility: hidden;
        }

        .option-btn {
            font-size: 20px;
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            background-color: #ffffff;
            color: #333;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.2s;
            font-weight: bold;
            min-width: 140px;
        }

        .option-btn:hover {
            background-color: #f1f2f6;
            transform: translateY(-2px);
        }

        .option-btn:disabled {
            cursor: not-allowed;
            transform: none;
        }

        .correct { background-color: #2ed573 !important; color: white !important; }
        .wrong { background-color: #ff4757 !important; color: white !important; }

        .message {
            height: 30px;
            margin-top: 15px;
            font-size: 22px;
            font-weight: bold;
            color: #333;
        }

        .footer {
            position: absolute;
            bottom: 20px;
            font-size: 14px;
            color: #7f8c8d;
        }

        /* 遊戲覆蓋畫面 (開始與結束) */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 10;
        }

        .overlay h1 { font-size: 48px; margin-bottom: 20px; }
        .overlay p { font-size: 24px; margin-bottom: 40px; }
        .start-btn {
            font-size: 28px;
            padding: 15px 40px;
            border: none;
            border-radius: 50px;
            background: #2ed573;
            color: white;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(46, 213, 115, 0.4);
            transition: 0.3s;
        }
        .start-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>

    <div class="overlay" id="overlay">
        <h1 id="overlayTitle">乘法公式極速挑戰</h1>
        <p id="overlayDesc">總時間 2 分鐘，每題限時 3 秒！</p>
        <button class="start-btn" onclick="startGame()" id="overlayBtn">開始遊戲</button>
    </div>

    <div class="header">
        <div class="info-board">總時間：<span id="totalTimeDisplay">02:00</span></div>
        <div class="info-board">分數：<span id="score">0</span></div>
    </div>

    <div class="card-container" id="cardContainer" onclick="flipCard()">
        <div class="card" id="card">
            <div class="card-face card-back"></div>
            <div class="card-face card-front" id="questionText"></div>
        </div>
    </div>

    <div class="timer-container" id="timerContainer">
        <div class="timer-bar" id="timerBar"></div>
    </div>

    <div class="options-container" id="optionsContainer">
        <button class="option-btn" id="btnA" onclick="checkAnswer(0)"></button>
        <button class="option-btn" id="btnB" onclick="checkAnswer(1)"></button>
        <button class="option-btn" id="btnC" onclick="checkAnswer(2)"></button>
    </div>

    <div class="message" id="messageText"></div>

    <div class="footer">本遊戲由阿緯老師設計</div>

    <script>
        // --- 題庫自動生成器 (產生超過 100 題的變化) ---
        let questions = [];
        
        // 類型 1: (x ± a)² 與 (x+a)(x-a) ，a 從 1 到 15 (共 45 題)
        for(let i = 1; i <= 15; i++) {
            let i_sq = i * i;
            let i_2 = 2 * i;
            questions.push({ q: `(x + ${i})²`, ans: `x² + ${i_2}x + ${i_sq}`, wrong: [`x² + ${i_sq}`, `x² - ${i_2}x + ${i_sq}`] });
            questions.push({ q: `(x - ${i})²`, ans: `x² - ${i_2}x + ${i_sq}`, wrong: [`x² + ${i_2}x + ${i_sq}`, `x² - ${i_sq}`] });
            questions.push({ q: `(x + ${i})(x - ${i})`, ans: `x² - ${i_sq}`, wrong: [`x² - ${i_2}x + ${i_sq}`, `x² + ${i_sq}`] });
        }

        // 類型 2: 帶係數的 (ax ± b)² 與 (ax+b)(ax-b)，a從2~5，b從1~5 (共 60 題)
        for(let a = 2; a <= 5; a++) {
            for(let b = 1; b <= 5; b++) {
                let a_sq = a * a;
                let b_sq = b * b;
                let ab2 = 2 * a * b;
                questions.push({ q: `(${a}x + ${b})²`, ans: `${a_sq}x² + ${ab2}x + ${b_sq}`, wrong: [`${a_sq}x² + ${b_sq}`, `${a_sq}x² - ${ab2}x + ${b_sq}`] });
                questions.push({ q: `(${a}x - ${b})²`, ans: `${a_sq}x² - ${ab2}x + ${b_sq}`, wrong: [`${a_sq}x² + ${ab2}x + ${b_sq}`, `${a_sq}x² - ${b_sq}`] });
                questions.push({ q: `(${a}x + ${b})(${a}x - ${b})`, ans: `${a_sq}x² - ${b_sq}`, wrong: [`${a_sq}x² - ${ab2}x + ${b_sq}`, `${a_sq}x² + ${b_sq}`] });
            }
        }
        // 目前題庫總數：105 題

        // --- 遊戲邏輯變數 ---
        let score = 0;
        let currentQuestion = null;
        let isFlipped = false;
        let gameActive = false;
        
        // 計時器相關變數
        let totalTimeLeft = 120; // 總時間 120 秒 (2分鐘)
        let totalTimeInterval;
        
        let questionTimerInterval;
        let questionTimeLeft = 3000; // 單題作答時間 3000 毫秒 (3秒)
        let correctOptionIndex = -1;

        // DOM 元素
        const card = document.getElementById('card');
        const questionText = document.getElementById('questionText');
        const timerContainer = document.getElementById('timerContainer');
        const timerBar = document.getElementById('timerBar');
        const optionsContainer = document.getElementById('optionsContainer');
        const scoreElement = document.getElementById('score');
        const messageText = document.getElementById('messageText');
        const totalTimeDisplay = document.getElementById('totalTimeDisplay');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlayTitle');
        const overlayDesc = document.getElementById('overlayDesc');
        const overlayBtn = document.getElementById('overlayBtn');
        const buttons = [
            document.getElementById('btnA'),
            document.getElementById('btnB'),
            document.getElementById('btnC')
        ];

        // 啟動總遊戲
        function startGame() {
            score = 0;
            totalTimeLeft = 120;
            updateScore();
            updateTotalTimeDisplay();
            overlay.style.display = "none";
            gameActive = true;

            // 啟動總計時器
            totalTimeInterval = setInterval(() => {
                totalTimeLeft--;
                updateTotalTimeDisplay();

                if (totalTimeLeft <= 10) {
                    totalTimeDisplay.parentElement.classList.add('time-alert'); // 最後10秒變紅字
                }

                if (totalTimeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        // 結束遊戲
        function endGame() {
            clearInterval(totalTimeInterval);
            clearInterval(questionTimerInterval);
            gameActive = false;
            
            // 恢復畫面初始狀態
            card.classList.remove('flipped');
            optionsContainer.style.visibility = "hidden";
            timerContainer.style.visibility = "hidden";
            messageText.innerText = "";
            isFlipped = false;
            totalTimeDisplay.parentElement.classList.remove('time-alert');

            // 顯示結算畫面
            overlayTitle.innerText = "時間到！";
            overlayDesc.innerText = `你的最終得分是：${score} 分`;
            overlayBtn.innerText = "再玩一次";
            overlay.style.display = "flex";
        }

        // 更新總時間顯示 (MM:SS)
        function updateTotalTimeDisplay() {
            let minutes = Math.floor(totalTimeLeft / 60);
            let seconds = totalTimeLeft % 60;
            totalTimeDisplay.innerText = 
                (minutes < 10 ? "0" : "") + minutes + ":" + 
                (seconds < 10 ? "0" : "") + seconds;
        }

        // 翻牌邏輯
        function flipCard() {
            if (isFlipped || !gameActive) return; 
            
            isFlipped = true;
            messageText.innerText = "";
            
            // 隨機抽一題
            currentQuestion = questions[Math.floor(Math.random() * questions.length)];
            questionText.innerText = currentQuestion.q;

            // 準備選項並打亂
            let options = [currentQuestion.ans, currentQuestion.wrong[0], currentQuestion.wrong[1]];
            options = shuffleArray(options);
            correctOptionIndex = options.indexOf(currentQuestion.ans);

            const labels = ["A. ", "B. ", "C. "];
            for (let i = 0; i < 3; i++) {
                buttons[i].innerText = labels[i] + options[i];
                buttons[i].className = "option-btn"; 
                buttons[i].disabled = false;
            }

            card.classList.add('flipped');

            // 延遲顯示選項與單題計時器
            setTimeout(() => {
                if(!gameActive) return; // 防止在動畫期間遊戲結束
                optionsContainer.style.visibility = "visible";
                timerContainer.style.visibility = "visible";
                startQuestionTimer();
            }, 300);
        }

        // 單題 3 秒計時器
        function startQuestionTimer() {
            questionTimeLeft = 3000;
            timerBar.style.width = "100%";
            timerBar.style.backgroundColor = "#ff4757";

            questionTimerInterval = setInterval(() => {
                questionTimeLeft -= 50; 
                let percentage = (questionTimeLeft / 3000) * 100;
                timerBar.style.width = percentage + "%";

                if (questionTimeLeft <= 0) {
                    clearInterval(questionTimerInterval);
                    handleTimeout();
                }
            }, 50);
        }

        function checkAnswer(selectedIndex) {
            clearInterval(questionTimerInterval);
            disableButtons();

            if (selectedIndex === correctOptionIndex) {
                score += 5;
                buttons[selectedIndex].classList.add("correct");
                messageText.innerText = "答對了！ +5分";
                messageText.style.color = "#2ed573";
            } else {
                score -= 3;
                buttons[selectedIndex].classList.add("wrong");
                buttons[correctOptionIndex].classList.add("correct");
                messageText.innerText = "答錯了！ -3分";
                messageText.style.color = "#ff4757";
            }
            
            updateScore();
            scheduleReset();
        }

        function handleTimeout() {
            disableButtons();
            score -= 2;
            buttons[correctOptionIndex].classList.add("correct");
            messageText.innerText = "時間到！ -2分";
            messageText.style.color = "#f39c12";
            updateScore();
            scheduleReset();
        }

        function disableButtons() {
            buttons.forEach(btn => btn.disabled = true);
        }

        function updateScore() {
            scoreElement.innerText = score;
        }

        function scheduleReset() {
            setTimeout(() => {
                if(!gameActive) return; // 如果在重置期間遊戲結束，就不執行
                card.classList.remove('flipped');
                optionsContainer.style.visibility = "hidden";
                timerContainer.style.visibility = "hidden";
                messageText.innerText = "";
                isFlipped = false;
            }, 1200); // 配合節奏變快，重置時間縮短為 1.2 秒
        }

        // 陣列洗牌函數
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }
    </script>
</body>
</html>
